timesteps: [0,250]

blur_kernel_size: 51
system_g: 3

name: "${dataset}_${exp_setting}_ubp_${brain_backbone}_${vision_backbone}"

models:
  brain:
    # target: base.eeg_backbone.EEGnet
    target: "base.eeg_backbone.${brain_backbone}"
    params:
        c_num: 17
        z_dim: ${z_dim}
        timesteps: ${timesteps}

model:
  amp_phase_on: true
  freq_mod_mode: film
  freq_use_amp: true
  freq_use_phase: true
  freq_use_circ_var: true
  adaptive_temp_on: true
  reliability_source: phase_circ_var
  noise_corr_on: True
  noise_corr_hidden: 256
  noise_corr_weight: 0.05
  noise_corr_detach_aug : True
  copula_on: true
  copula_weight: 0.05
  copula_tau: 1.0
  copula_eps: 1e-6
  copula_on_lowrank: true
  uot_on: true
  uot_weight: 0.05
  uot_epsilon: 0.05
  uot_rho: 1.0
  uot_iters: 30
  uot_mass_reg_weight: 1.0
  uot_on_lowrank: true
  uot_detach_img: false
  bridge_on: true
  bridge_rank: 128
  bridge_dropout: 0.1
  bridge_heads: 4

  bridge_distill_weight: 0.1
  bridge_fuse_on: true
  bridge_attn_entropy_weight: 0.001

  spike_tokenizer_on: true
  spike_hidden_channels: 16
  spike_kernel_size: 9
  spike_decay: 0.9
  spike_threshold: 1.0
  spike_dropout: 0.1
  cca_adapter_on: True
  cca_rank: 64
  cca_dropout: 0.1
  cca_loss_weight: 0.02
  cca_lambda_offdiag: 0.005
  img_adapter_on: True
  eeg_adapter_on: True
  eeg_adapter_type: linear
  eeg_adapter_hidden: 1024
  img_adapter_type: linear
  img_adapter_hidden: 1024
  img_adapter_dropout: 0.1
  img_adapter_residual: true
  bt_weight: 0.0          # 0 就关闭 Barlow
  bt_lambda: 0.005
  bt_dim: 256
  bt_eps: 1e-9
  bt_on: fused             # fused or brain
  bt_use_projector: True
  energy_bands: [[1,4],[4,8],[8,13],[13,30],[30,80]]
  energy_eps: 1e-6
  energy_dropout: 0.0
  lambda_txt: 0.0 # 0.05
  txt_multi_positive: true   # ✅ 强烈建议 true
  lambda_proto: 0.2
  proto_mode: "ce"     # 推荐先用 ce（更强）
  proto_temp: 0.07
  proto_detach: true
  # 统计域对齐 baseline
  align_on: true
  align_method: "bws"   # recenter | bws | zca | coral | adain
  align_to: "img"       # img | txt (仅 coral/adain 需要)
  align_target_use_raw: true
  align_eps: 1e-5
  align_shrink: 0.05
  align_detach_target: true
  align_detach_source_stats: false
  align_group_size: 0   # 0=full-cov; 64/128=group whitening
  whiten_on: True
  whiten_where: "eeg"     # 直接作用在 eeg_z
  whiten_mode: "bn"       # 先用 bn，最稳
  whiten_eps: 1e-5
  whiten_detach_stats: false
  whiten_shrink: 0.05

  whiten_reduce_dim: 0

  use_post_whiten_proj: false
  post_proj_type: linear
  post_proj_dim: 1024
  post_proj_hidden_dim: 2048
  post_proj_dropout: 0.01
  post_proj_residual: True
  post_proj_scale: 0.1
  proj_feat_l2_weight: 1e-4
  proj_weight_l2_weight: 0.0
  proc_weight: 0.0 # 0.01      # 先很小
  proc_dim: 256
  proc_use_ln: false
  proc_detach_img: true
  txt_head:
      hidden: 1024
      dropout: 0.0
      residual: true
      detach_backbone: false   # 想让 txt 不干扰 brain 就设 true
  txt_eps: 1e-8
  mean_cons_weight: 0.05
  mean_cons_detach_mean: true
  mean_cons_type: cosine   # 或 mse
  freq_prior:
      enable: true
      fs: 250
      mode: bank           # bank | sinc
      out: mix             # mix | time_concat | channel_concat
      include_raw: true
      kernel_size: 129
      window: hamming
      bands_hz: [[1,4],[4,8],[8,13],[13,30],[30,45]]
      learnable_bank: false

data:
  data_dir: data/things-eeg/Preprocessed_data_250Hz_whiten
  selected_ch: ['P7', 'P5', 'P3', 'P1','Pz', 'P2', 'P4', 'P6', 'P8', 'PO7', 'PO3', 'POz', 'PO4', 'PO8','O1', 'Oz', 'O2']
  model_type: ${vision_backbone}
  train_batch_size: 1024
  val_batch_size: 200
  test_batch_size: 200
  uncertainty_aware: True
  blur_type:
    target: base.inpating_data.FoveaBlur
    params:
          h: 224
          w: 224
          blur_kernel_size: ${blur_kernel_size}
          curve_type: exp
          system_g:  ${system_g}

  train_avg: True
  test_avg: True
  timesteps: ${timesteps}

train:
  epoch: ${epoch}
  optimizer: AdamW
  lr: ${lr}
  
save_dir: 'exp'